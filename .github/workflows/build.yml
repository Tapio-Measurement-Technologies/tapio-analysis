name: Build and Release Executable

on:
  push:
    tags:
      - '*'

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    environment: Production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Python
        uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c
        with:
          python-version: '3.12.8'

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Create version file
        run: echo "__version__ = '${{ github.ref_name }}'" > src/version.py

      - name: Create version resource file
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $parts = ([regex]::Matches($version, '\d+')).Value
          $v = @('0', '0', '0', '0')
          for ($i = 0; $i -lt [Math]::Min($parts.Count, 3); $i++) { $v[$i] = $parts[$i] }

          $versionInfo = @"
          # UTF-8
          VSVersionInfo(
            ffi=FixedFileInfo(
              filevers=($($v[0]), $($v[1]), $($v[2]), $($v[3])),
              prodvers=($($v[0]), $($v[1]), $($v[2]), $($v[3])),
              mask=0x3f,
              flags=0x0,
              OS=0x40004,
              fileType=0x1,
              subtype=0x0,
              date=(0, 0)
              ),
            kids=[
              StringFileInfo(
                [
                StringTable(
                  u'040904B0',
                  [StringStruct(u'CompanyName', u'Tapio Measurement Technologies Oy'),
                  StringStruct(u'FileDescription', u'Tapio Analysis'),
                  StringStruct(u'FileVersion', u'$version'),
                  StringStruct(u'InternalName', u'tapio-analysis'),
                  StringStruct(u'LegalCopyright', u'Copyright (c) Tapio Measurement Technologies Oy'),
                  StringStruct(u'OriginalFilename', u'tapio-analysis.exe'),
                  StringStruct(u'ProductName', u'Analysis'),
                  StringStruct(u'ProductVersion', u'$version')])
                ]),
              VarFileInfo([VarStruct(u'Translation', [1033, 1200])])
            ]
          )
          "@

          $versionInfo | Out-File -FilePath "version_info.txt" -Encoding UTF8

      - name: Build executable
        run: >
          pyinstaller
          -p src
          --onefile
          --noconsole
          --hidden-import "gui.paper_machine_data"
          --hidden-import "utils.filters"
          --hidden-import "utils.signal_processing"
          --add-data "src/loaders/:loaders/"
          --add-data "src/exporters/:exporters/"
          --add-data "src/analyses/:analyses/"
          --add-data "src/assets/:assets"
          --splash src/assets/splash.png
          --icon src/assets/tapio_favicon.ico
          --version-file version_info.txt
          src/main.py

      - name: Rename executable
        run: >
          mv
          dist/main.exe
          dist/tapio-analysis-${{ github.ref_name }}.exe

      - name: Azure Login
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Sign executable
        uses: azure/artifact-signing-action@b443cf8ea4124818d2ea9f043cba29fc3ec47b16
        with:
          endpoint: https://neu.codesigning.azure.net/
          signing-account-name: ${{ secrets.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_ARTIFACT_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}/dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Audit dependencies and generate signed-executable SBOM
        uses: Tapio-Measurement-Technologies/tapio-build-tooling/actions/python-release-evidence@e5cd53cc298dd90976e66867a3066f40f4b12d34
        with:
          config: build-tooling.toml
          product: tapio-analysis
          requirement-group: combined
          output: dist/tapio-analysis-${{ github.ref_name }}.cdx.json
          artifact: dist/tapio-analysis-${{ github.ref_name }}.exe
          version: ${{ github.ref_name }}
          platform: windows-x86_64
          audit: 'true'
          upload-name: tapio-analysis-${{ github.ref_name }}-sbom

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tapio-analysis-${{ github.ref_name }}
          path: |
            dist/tapio-analysis-${{ github.ref_name }}.exe
            dist/tapio-analysis-${{ github.ref_name }}.cdx.json
          if-no-files-found: error

      - name: Clean up version file
        if: always()
        run: rm src/version.py


  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tapio-analysis-${{ github.ref_name }}
          path: dist/

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "dist/tapio-analysis-${{ github.ref_name }}.exe" \
            "dist/tapio-analysis-${{ github.ref_name }}.cdx.json" \
            --repo "${{ github.repository }}" \
            --title "Release ${{ github.ref_name }}" \
            --notes "" \
            --verify-tag
