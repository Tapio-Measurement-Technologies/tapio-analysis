name: Supply chain

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check dependencies and generate source SBOM
        uses: Tapio-Measurement-Technologies/tapio-build-tooling/actions/python-supply-chain@d8b734f32080d7251af36513c066733004a49bde
        with:
          config: build-tooling.toml
          product: tapio-analysis
          requirement-group: combined
          output: dist/tapio-analysis-${{ github.sha }}-source.cdx.json
          platform: source
          audit: 'true'
          upload-name: tapio-analysis-source-sbom
